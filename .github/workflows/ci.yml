name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-frozen.txt
          python -m pip install -e .
      - name: Verify public core
        run: python scripts/verify_public_release.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify complete repository
        run: python scripts/verify_full_repository.py

